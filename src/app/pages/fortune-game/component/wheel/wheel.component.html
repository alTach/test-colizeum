<svg id="wsvg" width="390" height="390" viewBox="0 0 390 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Rim gold gradient -->
    <radialGradient id="outerRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="45%" stop-color="#e6a800" />
      <stop offset="100%" stop-color="#7a5200" />
    </radialGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,240,80,0.55)" />
      <stop offset="60%" stop-color="rgba(255,180,0,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Hub Gradient -->
    <radialGradient id="hubGrd" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe57a" />
      <stop offset="50%" stop-color="#c98f00" />
      <stop offset="100%" stop-color="#5a3c00" />
    </radialGradient>
  </defs>

  <!-- Static outer rim border -->
  <circle cx="195" cy="195" r="194" fill="url(#outerRim)" stroke="none" />
  <circle cx="195" cy="195" r="187" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Оболочка для начального смещения секторов колеса на половину сектора -->
  <g [attr.transform]="'rotate(' + (-180 / (prizes().length || 12)) + ', 195, 195)'">
    <!-- Main rotating wheel group -->
    <g #wheelGroup id="wheelGroup">
      <!-- Sectors -->
      @for (sec of sectors(); track sec.id) {
        <!-- Sector Pie Piece -->
        <path [title]="sec.label" [attr.d]="sec.pathD" [attr.fill]="sec.isGold ? '#d4940a' : '#151000'" stroke="#ffd700" stroke-width="1.2" />

        <!-- Sector Text label (Prize short name) -->
        <g [attr.transform]="sec.textTransform">
          <text text-anchor="middle" dominant-baseline="middle"
                font-family="'Arial Black', Arial, sans-serif" font-size="8.5"
                font-weight="900" letter-spacing="1"
                [attr.fill]="sec.isGold ? '#1a0f00' : '#ffd700'">
            COLIZEUX
          </text>
        </g>

        <!-- Rim Dot Decoration -->
        <circle [attr.cx]="sec.dotX" [attr.cy]="sec.dotY" r="3.5" fill="#fff" fill-opacity="0.85" />
      }

      <!-- Center Glow element -->
      <circle cx="195" cy="195" r="95" fill="url(#centerGlow)" />
    </g>
  </g>

  <!-- Rotating logo group (hub) -->
  <g #logoGroup id="logoGroup">
    <circle cx="195" cy="195" r="41" fill="rgba(255,210,0,0.18)" stroke="#ffd700" stroke-width="1.5" />
    <circle cx="195" cy="195" r="34" fill="url(#hubGrd)" stroke="#ffd700" stroke-width="2" />
    <circle cx="195" cy="195" r="29" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="1" />
    <text x="195" y="196" text-anchor="middle" dominant-baseline="middle"
          font-family="'Arial Black', Arial, sans-serif" font-size="18" font-weight="900" fill="#1a0f00">
      X
    </text>
    <!-- Hub dot decorations -->
    @for (dot of hubDots(); track $index) {
      <circle [attr.cx]="dot.cx" [attr.cy]="dot.cy" r="1.5" fill="rgba(0,0,0,0.4)" />
    }
  </g>

  <!-- Оболочка для начального смещения иконок призов -->
  <g [attr.transform]="'rotate(' + (-180 / (prizes().length || 12)) + ', 195, 195)'">
    <!-- Static icon group (rotated in JS code translation) -->
    <g #iconGroup id="iconGroup">
      @for (sec of sectors(); track sec.id) {
        <g>
          <!-- Текст иконки компенсирует начальный поворот SVG, чтобы эмодзи оставались строго вертикальными -->
          <text text-anchor="middle" dominant-baseline="middle" font-size="22"
                [attr.transform]="'rotate(' + (180 / (prizes().length || 12)) + ')'">
            {{ sec.icon }}
          </text>
        </g>
      }
    </g>
  </g>
</svg>
